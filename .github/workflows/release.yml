name: Release

# Pushing a v<DSPy version>+dszig.<N> tag (tools/release/cut.sh) verifies the
# scheme, reruns the full CI matrix on the tagged commit and publishes a
# GitHub release with a source archive and its SHA-256.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Enforce v<DSPy version>+dszig.<N>
        run: python3 tools/release/check_version.py --tag "$GITHUB_REF_NAME"
      - name: Tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Source archive and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          core="${version%%+*}"
          archive="dszig-$version.tar.gz"
          git archive --format=tar.gz --prefix="dszig-$version/" -o "$archive" "$GITHUB_SHA"
          sha256sum "$archive" > "$archive.sha256"
          gh release create "$tag" "$archive" "$archive.sha256" --verify-tag \
            --title "DSZig $version" --generate-notes \
            --notes "DSZig $version targets DSPy $core (https://github.com/stanfordnlp/dspy/releases/tag/$core) and requires Zig 0.17.0. Verified by the full CI matrix, including the DSPy $core cross-check."
