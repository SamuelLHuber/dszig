[project]
name = "dszig"
revision = "1.0"
require_reason = true

[providers]
# Developer-local macOS Keychain / OS keyring. Live inference credentials only;
# never committed, never written to transcripts.
keychain = "keyring://secretspec/dszig/{profile}/{key}"

[profiles.live.defaults]
providers = ["keychain"]
required = true

[profiles.live]
OPENAI_API_KEY = { description = "API key for the OpenAI-compatible endpoint used by zig build live and tools/dspy_reference/live.py" }
OPENAI_BASE_URL = { description = "OpenAI-compatible base URL; override for a homelab /v1 endpoint", default = "https://api.openai.com/v1" }
DSZIG_LIVE_MODEL = { description = "Model served by the endpoint (default gpt-4o-mini)", required = false }
DSZIG_LIVE_API = { description = "chat_completions (default) or responses", required = false }
